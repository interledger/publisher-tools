name: Check PR title

on:
  pull_request:
    branches: ['*']
    types:
      - edited
      - opened
      - synchronize

permissions:
  pull-requests: read

jobs:
  check-pr-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
