name: PR Checks

on:
  push:
    branches:
      - '!main'
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
      - run: pnpm format:check
      - run: pnpm lint:check
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Environment setup
        uses: ./.github/workflows/setup
      - name: Run tests
        run: pnpm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Let the api and frontend read these instead of a .dev.vars file
      CLOUDFLARE_INCLUDE_PROCESS_ENV: true
      OP_KEY_ID: ${{ secrets.E2E_OP_KEY_ID }}
      OP_PRIVATE_KEY: ${{ secrets.E2E_OP_PRIVATE_KEY }}
      OP_WALLET_ADDRESS: ${{ vars.E2E_OP_WALLET_ADDRESS }}
      AWS_ACCESS_KEY_ID: e2e
      AWS_SECRET_ACCESS_KEY: e2e
      AWS_S3_ENDPOINT: http://localhost:8081
      JWT_SECRET: e2e-jwt-secret-of-at-least-32-bytes
      E2E_WALLET_ADDRESS: ${{ vars.E2E_WALLET_ADDRESS }}
      E2E_WALLET_EMAIL: ${{ vars.E2E_WALLET_EMAIL }}
      E2E_WALLET_PASSWORD: ${{ secrets.E2E_WALLET_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Environment setup
        uses: ./.github/workflows/setup
      - name: Install Playwright browsers
        run: pnpm -C e2e exec playwright install --with-deps
      - name: Run E2E tests
        run: pnpm test:e2e
      # Traces record what the tests type, including the test wallet password
      - name: Encrypt Playwright report
        if: failure()
        working-directory: e2e
        env:
          ZIP_PASSWORD: ${{ secrets.E2E_PLAYWRIGHT_REPORT_PASSWORD }}
        run: |
          if [ -n "$ZIP_PASSWORD" ]; then
            zip -qr -P "$ZIP_PASSWORD" playwright-report.zip playwright-report test-results
          elif [ -n "$E2E_WALLET_PASSWORD" ]; then
            echo "::error::Set E2E_PLAYWRIGHT_REPORT_PASSWORD to upload a report that contains the test wallet login"
            exit 1
          else
            # Runs without secrets, like PRs from forks, have nothing to hide
            zip -qr playwright-report.zip playwright-report test-results
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report.zip
          retention-days: 14
